<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Used Phones Kenya</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
}

img {
    width: 100%;
    height: 60%;
    object-fit: contain;
}

h1 {
    margin-top: 20px;
    font-size: 24px;
}
</style>

</head>

<body>

<img src="i.png">

<h1 id="greeting"></h1>

<script>
let userName = prompt("Enter your name:");

if (!userName || userName.trim() === "") {
    userName = "Guest";
}

document.getElementById("greeting").innerText = "Hello " + userName;
</script>

</body>
</html>
