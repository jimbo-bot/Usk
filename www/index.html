<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Used Phones Kenya</title>

<style>
body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    flex-direction: column;
}
img {
    width: 100%;
    height: 60%;
    object-fit: contain;
}
</style>
</head>

<body>

<img src="i.png" onerror="this.style.display='none'">

<h1 id="greeting">Loading...</h1>

<script>
try {
    let userName = prompt("Enter your name:");

    if (!userName || userName.trim() === "") {
        userName = "Guest";
    }

    document.getElementById("greeting").innerText = "Hello " + userName;

} catch (e) {
    document.getElementById("greeting").innerText = "App Loaded";
}
</script>

</body>
</html>
